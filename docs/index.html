<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>滴滴行程地图 Demo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f7f9fb;
  --line: #d9e1e7;
  --line-strong: #b9c6d0;
  --text: #17242e;
  --muted: #64748b;
  --accent: #2563eb;
  --accent-soft: #eaf1ff;
  --dest: #d97706;
  --dest-soft: #fff3e0;
  --teal: #0f766e;
  --teal-soft: #e5f6f3;
  --shadow: 0 10px 30px rgba(23, 42, 58, .12);
  --radius: 8px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, select {
  font: inherit;
  color: inherit;
}
button {
  border: 0;
  background: none;
  cursor: pointer;
}
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.icon-btn, .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 32px;
  padding: 5px 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface);
  color: var(--text);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  transition: border-color .12s ease, background .12s ease, color .12s ease;
}
.btn:hover {
  border-color: var(--line-strong);
  background: var(--surface-2);
}
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn.primary:hover { background: #1d4ed8; }
.icon-btn {
  width: 34px;
  padding: 0;
  font-size: 16px;
}
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.ellipsis {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  height: 52px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  z-index: 1300;
}
.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  font-size: 15px;
}
.brand-mark {
  width: 24px;
  height: 24px;
  flex: none;
  border-radius: 7px;
  background:
    linear-gradient(135deg, var(--accent) 0 44%, transparent 44% 100%),
    linear-gradient(315deg, var(--dest) 0 44%, transparent 44% 100%),
    var(--teal);
}
.brand strong {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.header-meta {
  min-width: 0;
  color: var(--muted);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.demo-badge {
  flex: none;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--teal-soft);
  color: var(--teal);
  font-size: 11px;
  font-weight: 700;
}
.header-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

main {
  flex: 1;
  min-height: 0;
  display: flex;
  position: relative;
}
.side-panel {
  width: 344px;
  flex: none;
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
  z-index: 1200;
}
.sheet-handle { display: none; }
.sheet-mini { display: none; }
.tabs {
  flex: none;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  padding: 10px 12px 8px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.tab-btn {
  min-height: 34px;
  border-radius: 7px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
}
.tab-btn:hover {
  background: var(--surface-2);
  color: var(--text);
}
.tab-btn[aria-selected="true"] {
  background: var(--accent-soft);
  color: var(--accent);
}
.aside-body {
  flex: 1;
  min-height: 0;
  overflow: auto;
  overscroll-behavior: contain;
}
.tab-panel { display: none; padding: 12px; }
.tab-panel.active { display: block; }
.panel-section { margin-bottom: 16px; }
.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 0 0 8px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}
.section-title .count {
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.stat-cell {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-2);
  padding: 9px 10px;
}
.stat-cell b {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 18px;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}
.stat-cell span {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: 11px;
}
.stat-cell.wide { grid-column: span 2; }
.chart-box {
  width: 100%;
  height: 150px;
}
.chart-box.city-chart { height: 150px; }
.chart-empty {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 12px;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
}
.list { display: flex; flex-direction: column; gap: 6px; }
.list-row {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 38px;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface);
  text-align: left;
}
.list-row:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.list-row.selected {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
  background: var(--accent-soft);
}
.list-row .name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 600;
}
.list-row .sub {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--muted);
  font-size: 11px;
}
.list-row .badge {
  flex: none;
  min-width: 26px;
  text-align: center;
  padding: 2px 6px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.list-row .badge.dest {
  background: var(--dest-soft);
  color: var(--dest);
}
.list-row .badge.teal {
  background: var(--teal-soft);
  color: var(--teal);
}
.detail-block {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-2);
  padding: 10px;
}
.detail-block h3 {
  margin: 0 0 6px;
  font-size: 14px;
  line-height: 1.35;
}
.detail-block .meta {
  margin: 0 0 10px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
  word-break: break-all;
}
.detail-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
}
.detail-cell {
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface);
  padding: 7px;
  text-align: center;
}
.detail-cell b {
  display: block;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}
.detail-cell span {
  color: var(--muted);
  font-size: 10px;
}
.route-detail {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 11px;
  line-height: 1.55;
}
.status-line {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 24px;
  margin-top: 8px;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 11px;
}
.status-line.ok {
  color: var(--teal);
  border-color: #b9ddd8;
  background: var(--teal-soft);
}

.map-shell {
  flex: 1;
  min-width: 0;
  position: relative;
  background: #dfe7ec;
}
#map {
  position: absolute;
  inset: 0;
  z-index: 1;
}
.map-toolbar {
  position: absolute;
  top: 10px;
  left: 10px;
  right: 10px;
  z-index: 1100;
  background: rgba(255, 255, 255, .96);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 6px 22px rgba(23, 42, 58, .1);
  padding: 8px;
}
.toolbar-main {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}
.search-wrap {
  position: relative;
  flex: 1 1 190px;
  min-width: 150px;
}
.search-wrap input {
  width: 100%;
  height: 34px;
  padding: 0 32px 0 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface);
  font-size: 13px;
  outline: none;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-icon {
  position: absolute;
  top: 8px;
  right: 9px;
  width: 18px;
  height: 18px;
  color: var(--muted);
  pointer-events: none;
}
.toolbar-select {
  height: 34px;
  padding: 0 8px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface);
  font-size: 12px;
  outline: none;
}
.view-actions {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.segmented {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface-2);
  padding: 2px;
  overflow: hidden;
}
.segmented button {
  min-width: 52px;
  min-height: 28px;
  padding: 3px 9px;
  border-radius: 5px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}
.segmented button:hover { color: var(--text); }
.segmented button.active {
  background: var(--surface);
  color: var(--accent);
  box-shadow: 0 1px 4px rgba(23, 42, 58, .12);
}
.check-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 30px;
  color: var(--muted);
  font-size: 12px;
  cursor: pointer;
}
.check-label input {
  width: 15px;
  height: 15px;
  accent-color: var(--accent);
}
.map-legend {
  position: absolute;
  left: 10px;
  bottom: 26px;
  z-index: 1000;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: rgba(255, 255, 255, .94);
  box-shadow: 0 4px 14px rgba(23, 42, 58, .1);
  font-size: 11px;
  color: var(--muted);
}
.legend-item { display: inline-flex; align-items: center; gap: 5px; }
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 1px solid #fff;
  box-shadow: 0 0 0 1px var(--line);
}
.legend-dot.start { background: var(--accent); }
.legend-dot.dest { background: var(--dest); }
.legend-dot.both {
  background: linear-gradient(135deg, var(--accent) 0 50%, var(--dest) 50% 100%);
}
.legend-line {
  width: 18px;
  height: 4px;
  border-radius: 2px;
  background: var(--accent);
}
.legend-line.selected {
  background: var(--dest);
  height: 6px;
}

.leaflet-container {
  font: inherit;
}
.place-dot,
.trip-dot {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #fff;
  border-radius: 50%;
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  box-shadow: 0 3px 10px rgba(23, 42, 58, .3);
  cursor: pointer;
  user-select: none;
  text-shadow: 0 1px 2px rgba(23, 42, 58, .35);
}
.place-dot.start { background: var(--accent); }
.place-dot.dest { background: var(--dest); }
.place-dot.both {
  background: linear-gradient(135deg, var(--accent) 0 50%, var(--dest) 50% 100%);
}
.place-dot.selected {
  box-shadow:
    0 0 0 5px rgba(37, 99, 235, .25),
    0 4px 14px rgba(23, 42, 58, .38);
  transform: scale(1.16);
}
.trip-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--dest);
  font-size: 0;
}
.marker-cluster {
  background-clip: padding-box;
  border-radius: 50%;
}
.marker-cluster div {
  width: 34px !important;
  height: 34px !important;
  margin-left: 3px !important;
  margin-top: 3px !important;
  border-radius: 50%;
  background: linear-gradient(135deg, #1d4ed8, #2563eb);
  color: #fff;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 3px 10px rgba(23, 42, 58, .3);
  border: 2px solid #fff;
}

@media (max-width: 900px) {
  header {
    padding: 0 10px;
    gap: 8px;
  }
  .header-meta { display: none; }
  main { flex-direction: column; }
  .side-panel {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 10px;
    top: auto;
    width: auto;
    height: min(56vh, 440px);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    transform: translateY(calc(100% - 48px));
    transition: transform .22s ease;
  }
  .side-panel.open { transform: none; }
  .sheet-handle {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 18px;
    color: var(--muted);
  }
  .sheet-handle::before {
    content: "";
    width: 32px;
    height: 4px;
    border-radius: 999px;
    background: var(--line-strong);
  }
  .sheet-mini {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    height: 30px;
    padding: 0 12px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    background: var(--surface);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .sheet-mini span { color: var(--muted); font-weight: 500; }
  .map-toolbar { top: 8px; left: 8px; right: 8px; }
  .map-legend { left: 8px; bottom: 70px; flex-wrap: wrap; gap: 7px; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="brand-mark"></span>
      <strong>滴滴行程地图</strong>
    </div>
    <span class="demo-badge">示例 Demo</span>
    <div class="header-meta" id="headerMeta">加载中</div>
    <div class="header-actions">
      <button class="btn" id="resetBtn" type="button">重置</button>
    </div>
  </header>
  <main>
    <aside class="side-panel" id="sidePanel">
      <button class="sheet-handle" id="sheetHandle" type="button" aria-label="展开面板"></button>
      <div class="sheet-mini" id="sheetMini"><span id="sheetMiniTitle">概览</span><span id="sheetMiniMeta"></span></div>
      <div class="tabs">
        <button class="tab-btn" id="tabOverview" type="button" aria-selected="true">概览</button>
        <button class="tab-btn" id="tabTrips" type="button" aria-selected="false">行程</button>
        <button class="tab-btn" id="tabPlaces" type="button" aria-selected="false">地点</button>
      </div>
      <div class="aside-body">
        <section id="panelOverview" class="tab-panel active">
          <div class="panel-section">
            <div class="stat-grid">
              <div class="stat-cell"><b id="statTrips">0</b><span>行程</span></div>
              <div class="stat-cell"><b id="statDistance">0</b><span>公里</span></div>
              <div class="stat-cell"><b id="statAmount">¥0</b><span>金额</span></div>
              <div class="stat-cell"><b id="statCities">0</b><span>城市</span></div>
            </div>
          </div>
          <div class="panel-section">
            <h2 class="section-title">出行趋势</h2>
            <div class="chart-box" id="trendChart"></div>
          </div>
          <div class="panel-section">
            <h2 class="section-title">城市分布</h2>
            <div class="chart-box city-chart" id="cityChart"></div>
          </div>
        </section>
        <section id="panelTrips" class="tab-panel">
          <div class="panel-section">
            <h2 class="section-title">行程列表 <span class="count" id="tripCount"></span></h2>
            <div class="list" id="tripList"></div>
          </div>
        </section>
        <section id="panelPlaces" class="tab-panel">
          <div class="panel-section">
            <h2 class="section-title">地点列表 <span class="count" id="placeCount"></span></h2>
            <div class="list" id="placeList"></div>
          </div>
        </section>
      </div>
    </aside>
    <div class="map-shell">
      <div id="map"></div>
      <div class="map-toolbar">
        <div class="toolbar-main">
          <div class="search-wrap">
            <input id="searchInput" type="search" placeholder="搜索地点或地址">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-3.5-3.5"></path>
            </svg>
          </div>
          <select class="toolbar-select" id="cityFilter" aria-label="城市"></select>
        </div>
        <div class="view-actions">
          <div class="segmented" role="group" aria-label="视图模式">
            <button type="button" data-mode="places" aria-pressed="true">地点</button>
            <button type="button" data-mode="lines" aria-pressed="false">连线</button>
          </div>
          <label class="check-label"><input id="lineToggle" type="checkbox"><span>显示全部连线</span></label>
          <button class="btn" id="clearSelectionBtn" type="button" hidden>清除选中</button>
          <button class="icon-btn" id="fitBtn" type="button" title="全览">⌂</button>
          <button class="icon-btn" id="zoomInBtn" type="button" title="放大">+</button>
          <button class="icon-btn" id="zoomOutBtn" type="button" title="缩小">−</button>
        </div>
      </div>
      <div class="map-legend" id="mapLegend"></div>
    </div>
  </main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script>

<script>
(function () {
  "use strict";

  const rawTrips = window.__TRIPS__ || [];
  const state = {
    city: "all",
    q: "",
    mode: "places",
    showLines: false,
    place: "",
    trip: "",
    tab: "overview"
  };

  const $ = function (id) { return document.getElementById(id); };
  const el = {
    headerMeta: $("headerMeta"),
    sheetMiniTitle: $("sheetMiniTitle"),
    sheetMiniMeta: $("sheetMiniMeta"),
    statTrips: $("statTrips"),
    statDistance: $("statDistance"),
    statAmount: $("statAmount"),
    statCities: $("statCities"),
    trendChart: $("trendChart"),
    cityChart: $("cityChart"),
    tripCount: $("tripCount"),
    tripList: $("tripList"),
    placeCount: $("placeCount"),
    placeList: $("placeList"),
    searchInput: $("searchInput"),
    cityFilter: $("cityFilter"),
    lineToggle: $("lineToggle"),
    clearSelectionBtn: $("clearSelectionBtn"),
    mapLegend: $("mapLegend"),
    sidePanel: $("sidePanel"),
    sheetHandle: $("sheetHandle"),
    sheetMini: $("sheetMini"),
    fitBtn: $("fitBtn"),
    zoomInBtn: $("zoomInBtn"),
    zoomOutBtn: $("zoomOutBtn"),
    resetBtn: $("resetBtn")
  };

  let map = null;
  let clusterGroup = null;
  let lineLayer = null;
  let searchTimer = null;
  let trendChart = null;
  let cityChart = null;

  function pad2(value) { return String(value).padStart(2, "0"); }
  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }
  function parseNumber(value) {
    const n = parseFloat(value);
    return Number.isFinite(n) ? n : 0;
  }
  function parseDate(value) {
    if (!value) return null;
    const match = /^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ](\d{1,2}):(\d{1,2}))?/.exec(String(value));
    if (!match) return null;
    const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
    return isNaN(date.getTime()) ? null : date;
  }
  function fmtTime(value) {
    if (!value) return "时间缺失";
    return String(value).slice(0, 16);
  }
  function fmtAmount(value) {
    if (value == null || value === "") return "-";
    return "¥" + parseNumber(value).toFixed(2);
  }
  function fmtDistance(value) {
    if (value == null || value === "") return "-";
    return parseNumber(value).toFixed(1) + " km";
  }

  const places = [];
  const placeIndex = new Map();

  function getOrCreatePlace(city, name, lat, lng, matchedName, address) {
    const cleanName = String(name || "").trim();
    const latNum = Number(lat);
    const lngNum = Number(lng);
    if (!cleanName || !Number.isFinite(latNum) || !Number.isFinite(lngNum)) return null;
    const key = city + "|" + cleanName;
    if (placeIndex.has(key)) return placeIndex.get(key);
    const place = {
      id: places.length,
      key: key,
      city: city,
      name: cleanName,
      lat: latNum,
      lng: lngNum,
      matchedName: String(matchedName || ""),
      address: String(address || ""),
      tripIds: []
    };
    placeIndex.set(key, place);
    places.push(place);
    return place;
  }

  const trips = rawTrips.map(function (raw, index) {
    const pickupTs = parseDate(raw.pickup);
    const date = pickupTs
      ? pickupTs.getFullYear() + "-" + pad2(pickupTs.getMonth() + 1) + "-" + pad2(pickupTs.getDate())
      : "";
    const trip = Object.assign({}, raw, {
      id: index,
      pickupTs: pickupTs,
      pickupDate: date,
      distanceNum: parseNumber(raw.distance),
      amountNum: parseNumber(raw.amount),
      originPlaceId: null,
      destPlaceId: null
    });
    const originPlace = getOrCreatePlace(
      trip.cityNorm,
      raw.origin,
      trip.o && trip.o.lat,
      trip.o && trip.o.lng,
      trip.o && trip.o.matched_name,
      trip.o && trip.o.address
    );
    const destPlace = getOrCreatePlace(
      trip.cityNorm,
      raw.dest,
      trip.d && trip.d.lat,
      trip.d && trip.d.lng,
      trip.d && trip.d.matched_name,
      trip.d && trip.d.address
    );
    if (originPlace) {
      trip.originPlaceId = originPlace.id;
      originPlace.tripIds.push(index);
    }
    if (destPlace) {
      trip.destPlaceId = destPlace.id;
      destPlace.tripIds.push(index);
    }
    return trip;
  });

  function getPlace(id) {
    if (id === "" || id === null || id === undefined) return null;
    return places[Number(id)] || null;
  }
  function getTrip(id) {
    if (id === "" || id === null || id === undefined) return null;
    return trips[Number(id)] || null;
  }
  function matchesFilters(trip) {
    if (state.city !== "all" && trip.cityNorm !== state.city) return false;
    const q = state.q.trim().toLowerCase();
    if (!q) return true;
    const origin = getPlace(trip.originPlaceId);
    const dest = getPlace(trip.destPlaceId);
    const haystack = [
      trip.origin,
      trip.dest,
      origin ? origin.matchedName : "",
      origin ? origin.address : "",
      dest ? dest.matchedName : "",
      dest ? dest.address : ""
    ].join(" ").toLowerCase();
    return haystack.indexOf(q) !== -1;
  }
  function getVisibleTrips() {
    return trips.filter(matchesFilters);
  }
  function computePlaceStats(visible) {
    const stats = new Map();
    visible.forEach(function (trip) {
      if (trip.originPlaceId !== null) {
        const item = stats.get(trip.originPlaceId) || { start: 0, dest: 0, total: 0 };
        item.start += 1;
        item.total += 1;
        stats.set(trip.originPlaceId, item);
      }
      if (trip.destPlaceId !== null) {
        const item = stats.get(trip.destPlaceId) || { start: 0, dest: 0, total: 0 };
        item.dest += 1;
        item.total += 1;
        stats.set(trip.destPlaceId, item);
      }
    });
    return stats;
  }
  function tripUsesPlace(trip, placeId) {
    return trip.originPlaceId === placeId || trip.destPlaceId === placeId;
  }
  function relatedTrips(visible, placeId) {
    return visible.filter(function (trip) { return tripUsesPlace(trip, placeId); });
  }
  function relatedPlaceIds(tripsWithPlace) {
    const ids = new Set();
    tripsWithPlace.forEach(function (trip) {
      if (trip.originPlaceId !== null) ids.add(trip.originPlaceId);
      if (trip.destPlaceId !== null) ids.add(trip.destPlaceId);
    });
    return ids;
  }

  function pruneSelection(visible) {
    const stats = computePlaceStats(visible);
    if (state.place !== "" && !stats.has(Number(state.place))) {
      state.place = "";
    }
    if (state.trip !== "" && !visible.some(function (t) { return t.id === Number(state.trip); })) {
      state.trip = "";
    }
    if (state.trip !== "") {
      const trip = getTrip(state.trip);
      if (trip && (trip.originPlaceId === null || trip.destPlaceId === null)) {
        state.trip = "";
      }
    }
    el.clearSelectionBtn.hidden = !state.place && state.trip === "";
  }

  function renderAll() {
    const visible = getVisibleTrips();
    pruneSelection(visible);
    updateStats(visible);
    updateCharts(visible);
    renderTripList(visible);
    renderPlaceList(visible);
    renderMap(visible);
    updateLegend();
    el.sheetMiniMeta.textContent = visible.length + " 条";
  }

  function updateStats(visible) {
    let distance = 0;
    let amount = 0;
    const cities = new Set();
    visible.forEach(function (trip) {
      distance += trip.distanceNum;
      amount += trip.amountNum;
      cities.add(trip.cityNorm);
    });
    el.headerMeta.textContent = "示例数据 · 当前 " + visible.length + " 条";
    el.statTrips.textContent = visible.length;
    el.statDistance.textContent = Math.round(distance).toLocaleString();
    el.statAmount.textContent = "¥" + Math.round(amount).toLocaleString();
    el.statCities.textContent = cities.size;
  }

  function initCharts() {
    trendChart = echarts.init(el.trendChart);
    cityChart = echarts.init(el.cityChart);
  }
  function updateCharts(visible) {
    if (!trendChart || !cityChart) return;
    const byDate = new Map();
    const byCity = new Map();
    visible.forEach(function (trip) {
      const date = trip.pickupDate || "未知";
      byDate.set(date, (byDate.get(date) || 0) + 1);
      byCity.set(trip.cityNorm, (byCity.get(trip.cityNorm) || 0) + 1);
    });
    const dates = Array.from(byDate.keys()).sort();
    const cities = Array.from(byCity.keys()).sort(function (a, b) {
      return (byCity.get(b) - byCity.get(a)) || a.localeCompare(b);
    });
    trendChart.setOption({
      grid: { left: 8, right: 8, top: 20, bottom: 24, containLabel: true },
      tooltip: { trigger: "axis" },
      xAxis: {
        type: "category",
        data: dates,
        axisLine: { lineStyle: { color: "#c7d2d8" } },
        axisLabel: { color: "#64748b", fontSize: 10 }
      },
      yAxis: {
        type: "value",
        minInterval: 1,
        splitLine: { lineStyle: { color: "#edf1f4" } },
        axisLabel: { color: "#64748b", fontSize: 10 }
      },
      series: [{
        type: "line",
        data: dates.map(function (date) { return byDate.get(date); }),
        smooth: true,
        symbolSize: 7,
        lineStyle: { width: 3, color: "#2563eb" },
        itemStyle: { color: "#2563eb" },
        areaStyle: { color: "rgba(37, 99, 235, .1)" }
      }]
    }, true);
    cityChart.setOption({
      grid: { left: 8, right: 20, top: 8, bottom: 8, containLabel: true },
      tooltip: { trigger: "axis" },
      xAxis: {
        type: "value",
        minInterval: 1,
        splitLine: { lineStyle: { color: "#edf1f4" } },
        axisLabel: { color: "#64748b", fontSize: 10 }
      },
      yAxis: {
        type: "category",
        data: cities,
        axisLine: { lineStyle: { color: "#c7d2d8" } },
        axisLabel: { color: "#64748b", fontSize: 10 }
      },
      series: [{
        type: "bar",
        data: cities.map(function (city) { return byCity.get(city); }),
        barWidth: 12,
        itemStyle: { color: "#0f766e", borderRadius: [0, 6, 6, 0] }
      }]
    }, true);
  }

  function renderTripList(visible) {
    const sorted = visible.slice().sort(function (a, b) {
      const left = a.pickupTs ? a.pickupTs.getTime() : -Infinity;
      const right = b.pickupTs ? b.pickupTs.getTime() : -Infinity;
      return right - left;
    });
    el.tripCount.textContent = sorted.length;
    el.tripList.innerHTML = sorted.map(function (trip) {
      const selected = String(trip.id) === state.trip ? " selected" : "";
      return '<button class="list-row' + selected + '" data-trip-id="' + trip.id + '">' +
        '<span class="name" title="' + esc(trip.origin + " → " + trip.dest) + '">' + esc(trip.origin + " → " + trip.dest) + "</span>" +
        '<span class="sub">' + esc(fmtTime(trip.pickup)) + " · " + esc(trip.cityNorm) + "</span>" +
        '<span class="badge teal">' + esc(fmtAmount(trip.amount)) + "</span>" +
        "</button>";
    }).join("") || '<div class="list-row"><span class="name">无匹配行程</span></div>';
  }

  function renderPlaceList(visible) {
    const stats = computePlaceStats(visible);
    const entries = [];
    stats.forEach(function (counts, id) {
      const place = getPlace(id);
      if (place && counts.total > 0) {
        entries.push({ place: place, counts: counts });
      }
    });
    entries.sort(function (a, b) { return b.counts.total - a.counts.total; });
    el.placeCount.textContent = entries.length;
    el.placeList.innerHTML = entries.map(function (entry) {
      const selected = String(entry.place.id) === state.place ? " selected" : "";
      const badge = entry.counts.dest > 0 ? "dest" : "start";
      return '<button class="list-row' + selected + '" data-place-id="' + entry.place.id + '">' +
        '<span class="name" title="' + esc(entry.place.name) + '">' + esc(entry.place.name) + "</span>" +
        '<span class="sub">' + esc(entry.place.city) + " · 起 " + entry.counts.start + " · 终 " + entry.counts.dest + "</span>" +
        '<span class="badge ' + badge + '">' + entry.counts.total + "</span>" +
        "</button>";
    }).join("") || '<div class="list-row"><span class="name">无匹配地点</span></div>';
  }

  function makePlaceIcon(placeId, startCount, destCount) {
    const cls = startCount > 0 && destCount > 0 ? "both" : (destCount > 0 ? "dest" : "start");
    const selected = String(placeId) === state.place ? " selected" : "";
    const total = startCount + destCount;
    return L.divIcon({
      className: "",
      html: '<div class="place-dot ' + cls + selected + '">' + total + "</div>",
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    });
  }

  function addODLine(trip, selected) {
    const origin = getPlace(trip.originPlaceId);
    const dest = getPlace(trip.destPlaceId);
    if (!origin || !dest) return null;
    const line = L.polyline([[origin.lat, origin.lng], [dest.lat, dest.lng]], {
      color: selected ? "#d97706" : "#2563eb",
      weight: selected ? 6 : 3,
      opacity: selected ? 0.92 : 0.45,
      lineJoin: "round"
    });
    line.addTo(lineLayer);
    return line;
  }

  function renderMap(visible) {
    if (!map) return;
    const stats = computePlaceStats(visible);
    if (clusterGroup) map.removeLayer(clusterGroup);
    if (lineLayer) map.removeLayer(lineLayer);
    clusterGroup = L.markerClusterGroup({
      maxClusterRadius: 62,
      showCoverageOnHover: false,
      zoomToBoundsOnClick: true
    });
    lineLayer = L.layerGroup();
    lineLayer.addTo(map);
    map.addLayer(clusterGroup);

    const selectedTrip = getTrip(state.trip);
    const selectedPlace = getPlace(state.place);
    let selectedTrips = [];
    let visiblePlaceIds = new Set();
    if (selectedTrip) {
      if (selectedTrip.originPlaceId !== null) visiblePlaceIds.add(selectedTrip.originPlaceId);
      if (selectedTrip.destPlaceId !== null) visiblePlaceIds.add(selectedTrip.destPlaceId);
      selectedTrips = [selectedTrip];
      addODLine(selectedTrip, true);
    } else if (selectedPlace) {
      selectedTrips = relatedTrips(visible, Number(state.place));
      visiblePlaceIds = relatedPlaceIds(selectedTrips);
      selectedTrips.slice(0, 30).forEach(function (trip) {
        addODLine(trip, false);
      });
    } else if (state.mode === "lines") {
      visible.forEach(function (trip) {
        addODLine(trip, false);
      });
      visiblePlaceIds = new Set(stats.keys());
    } else {
      if (state.showLines) {
        visible.forEach(function (trip) {
          addODLine(trip, false);
        });
      }
      visiblePlaceIds = new Set(stats.keys());
    }

    const directMarkers = [];
    stats.forEach(function (counts, id) {
      const place = getPlace(id);
      if (!place || counts.total <= 0) return;
      if (!visiblePlaceIds.has(id)) return;
      const marker = L.marker([place.lat, place.lng], {
        icon: makePlaceIcon(id, counts.start, counts.dest),
        title: place.name,
        zIndexOffset: String(id) === state.place ? 300 : 100
      });
      marker.on("click", function () {
        selectPlace(id);
      });
      if (selectedTrip || selectedPlace || state.mode === "lines") {
        marker.addTo(map);
        directMarkers.push(marker);
      } else {
        clusterGroup.addLayer(marker);
      }
    });

    fitView(stats, visiblePlaceIds, selectedTrip || selectedPlace);
  }

  function fitView(stats, visiblePlaceIds, hasSelection) {
    if (!map) return;
    const points = [];
    visiblePlaceIds.forEach(function (id) {
      const place = getPlace(id);
      if (place) points.push([place.lat, place.lng]);
    });
    if (points.length) {
      const bounds = L.latLngBounds(points);
      map.fitBounds(bounds.pad(0.28), { maxZoom: hasSelection ? 15 : 12 });
    } else {
      map.setView([33, 110], 5);
    }
  }

  function updateLegend() {
    if (state.mode === "lines") {
      el.mapLegend.innerHTML = '<span class="legend-item"><span class="legend-line"></span>行程 OD</span>';
    } else {
      el.mapLegend.innerHTML =
        '<span class="legend-item"><span class="legend-dot start"></span>起点</span>' +
        '<span class="legend-item"><span class="legend-dot dest"></span>终点</span>' +
        '<span class="legend-item"><span class="legend-dot both"></span>混合</span>' +
        (state.place || state.trip !== "" ? '<span class="legend-item"><span class="legend-line selected"></span>选中</span>' : "");
    }
  }

  function selectPlace(id) {
    state.place = String(id);
    state.trip = "";
    renderAll();
    openMobilePanel();
    selectTab("places", true);
  }
  function selectTrip(id) {
    state.trip = String(id);
    state.place = "";
    renderAll();
    openMobilePanel();
    selectTab("trips", true);
  }
  function clearSelection() {
    state.place = "";
    state.trip = "";
    renderAll();
  }

  function selectTab(tab, force) {
    state.tab = tab || "overview";
    ["overview", "trips", "places"].forEach(function (name) {
      const btn = $("tab" + name.charAt(0).toUpperCase() + name.slice(1));
      const panel = $("panel" + name.charAt(0).toUpperCase() + name.slice(1));
      if (btn) btn.setAttribute("aria-selected", String(name === state.tab));
      if (panel) panel.classList.toggle("active", name === state.tab);
    });
    el.sheetMiniTitle.textContent = state.tab === "overview" ? "概览" : (state.tab === "trips" ? "行程" : "地点");
    if (!force) openMobilePanel();
    window.setTimeout(function () {
      if (trendChart) trendChart.resize();
      if (cityChart) cityChart.resize();
      if (map) map.invalidateSize();
    }, 80);
  }

  function openMobilePanel() {
    if (window.innerWidth <= 900) el.sidePanel.classList.add("open");
  }

  function bindEvents() {
    el.searchInput.addEventListener("input", function () {
      if (searchTimer) window.clearTimeout(searchTimer);
      searchTimer = window.setTimeout(function () {
        state.q = el.searchInput.value;
        renderAll();
      }, 180);
    });
    el.cityFilter.addEventListener("change", function () {
      state.city = el.cityFilter.value;
      renderAll();
    });
    el.lineToggle.addEventListener("change", function () {
      state.showLines = el.lineToggle.checked;
      renderAll();
    });
    document.querySelectorAll(".segmented [data-mode]").forEach(function (button) {
      button.addEventListener("click", function () {
        state.mode = button.dataset.mode;
        document.querySelectorAll(".segmented [data-mode]").forEach(function (btn) {
          btn.classList.toggle("active", btn.dataset.mode === state.mode);
          btn.setAttribute("aria-pressed", String(btn.dataset.mode === state.mode));
        });
        renderAll();
      });
    });
    el.clearSelectionBtn.addEventListener("click", clearSelection);
    el.resetBtn.addEventListener("click", function () {
      state.city = "all";
      state.q = "";
      state.mode = "places";
      state.showLines = false;
      state.place = "";
      state.trip = "";
      el.searchInput.value = "";
      el.cityFilter.value = "all";
      el.lineToggle.checked = false;
      document.querySelectorAll(".segmented [data-mode]").forEach(function (btn) {
        btn.classList.toggle("active", btn.dataset.mode === "places");
        btn.setAttribute("aria-pressed", String(btn.dataset.mode === "places"));
      });
      renderAll();
    });
    el.fitBtn.addEventListener("click", function () {
      const visible = getVisibleTrips();
      const stats = computePlaceStats(visible);
      fitView(stats, new Set(stats.keys()), false);
    });
    el.zoomInBtn.addEventListener("click", function () { if (map) map.zoomIn(); });
    el.zoomOutBtn.addEventListener("click", function () { if (map) map.zoomOut(); });
    el.tripList.addEventListener("click", function (event) {
      const row = event.target.closest("[data-trip-id]");
      if (row) selectTrip(Number(row.dataset.tripId));
    });
    el.placeList.addEventListener("click", function (event) {
      const row = event.target.closest("[data-place-id]");
      if (row) selectPlace(Number(row.dataset.placeId));
    });
    document.querySelectorAll(".tab-btn").forEach(function (button) {
      button.addEventListener("click", function () {
        selectTab(button.id.replace("tab", "").toLowerCase());
      });
    });
    el.sheetHandle.addEventListener("click", function () {
      el.sidePanel.classList.toggle("open");
    });
    el.sheetMini.addEventListener("click", function () {
      el.sidePanel.classList.toggle("open");
    });
    window.addEventListener("resize", function () {
      if (map) map.invalidateSize();
      if (trendChart) trendChart.resize();
      if (cityChart) cityChart.resize();
    });
  }

  function populateFilters() {
    const counts = {};
    trips.forEach(function (trip) {
      counts[trip.cityNorm] = (counts[trip.cityNorm] || 0) + 1;
    });
    let html = '<option value="all">全部城市</option>';
    Object.keys(counts).sort(function (a, b) {
      return (counts[b] - counts[a]) || a.localeCompare(b);
    }).forEach(function (city) {
      html += '<option value="' + esc(city) + '">' + esc(city) + "（" + counts[city] + "）</option>";
    });
    el.cityFilter.innerHTML = html;
  }

  function initMap() {
    map = L.map("map", {
      zoomControl: false,
      minZoom: 3,
      maxZoom: 18
    }).setView([33, 110], 5);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
    populateFilters();
    bindEvents();
    initCharts();
    renderAll();
  }

  initMap();
})();
</script>
</body>
</html>
