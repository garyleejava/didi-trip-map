<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>滴滴行程地图 Demo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
:root {
  --bg: #f5f7f8;
  --panel: #ffffff;
  --line: #dfe5e8;
  --text: #1f2933;
  --muted: #697b89;
  --blue: #1677ff;
  --green: #13a8a8;
  --orange: #fa8c16;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}
header {
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 15px;
}
.brand-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--blue);
  box-shadow: 12px 0 0 -2px var(--orange), -12px 0 0 -2px var(--green);
}
.header-meta {
  color: var(--muted);
  font-size: 12px;
}
main {
  display: flex;
  height: calc(100vh - 48px);
}
aside {
  width: 280px;
  flex: none;
  overflow: auto;
  background: var(--panel);
  border-right: 1px solid var(--line);
  padding: 14px;
}
section {
  margin-bottom: 16px;
}
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.stat {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 8px;
  background: #fbfcfd;
}
.stat b {
  display: block;
  font-size: 17px;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stat span {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: 11px;
}
.filters label {
  display: block;
  margin-bottom: 10px;
  color: var(--muted);
  font-size: 12px;
}
.filters select,
.filters input[type="search"] {
  display: block;
  width: 100%;
  margin-top: 5px;
  padding: 8px 9px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #fff;
  color: var(--text);
  font-size: 13px;
  outline: none;
}
.filters select:focus,
.filters input[type="search"]:focus {
  border-color: var(--blue);
}
.check {
  display: flex !important;
  align-items: center;
  gap: 7px;
  cursor: pointer;
}
.check input {
  width: 16px;
  height: 16px;
  accent-color: var(--blue);
}
.selection-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 30px;
  margin-top: 2px;
  padding: 5px 7px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #fbfcfd;
}
.selection-label {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--blue);
  font-size: 12px;
  font-weight: 600;
}
.clear-btn {
  flex: none;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
  color: var(--muted);
  font-size: 12px;
  padding: 4px 8px;
  cursor: pointer;
}
.clear-btn:hover {
  color: var(--text);
  border-color: #b6c2ca;
}
.legend {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 11px;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex: none;
}
.legend-dot.start { background: var(--blue); }
.legend-dot.dest { background: var(--orange); }
.legend-line {
  width: 18px;
  height: 4px;
  border-radius: 2px;
  flex: none;
}
.legend-line.start { background: var(--blue); }
.legend-line.dest { background: var(--orange); }
.selected-section {
  margin-bottom: 16px;
}
.selected-trips {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 190px;
  overflow: auto;
}
.trip-row {
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #fbfcfd;
  padding: 7px 8px;
  font-size: 11px;
  line-height: 1.5;
}
.trip-row b {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text);
  font-size: 12px;
}
.trip-row .trip-meta {
  color: var(--muted);
}
.summary-title {
  margin: 0 0 8px;
  color: var(--muted);
  font-size: 12px;
}
.summary-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.summary-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  padding: 7px 8px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #fbfcfd;
  cursor: pointer;
}
.summary-row:hover {
  border-color: var(--blue);
  background: #f0f7ff;
}
.summary-row.selected {
  border-color: var(--blue);
  box-shadow: inset 0 0 0 1px var(--blue);
}
.summary-row .name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
}
.summary-row .count {
  flex: none;
  color: var(--blue);
  font-size: 13px;
  font-weight: 600;
}
.summary-row .roles {
  flex: none;
  color: var(--muted);
  font-size: 10px;
}
#map {
  flex: 1;
  min-width: 0;
  height: 100%;
}
.marker-dot {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  border: 2px solid #fff;
  box-shadow: 0 1px 5px rgba(15, 30, 45, 0.35);
  cursor: pointer;
  user-select: none;
}
.marker-dot.start { background: var(--blue); }
.marker-dot.dest { background: var(--orange); }
.marker-dot.both {
  background: linear-gradient(135deg, var(--blue) 50%, var(--orange) 50%);
}
.marker-dot.selected {
  box-shadow:
    0 0 0 5px rgba(22, 119, 255, 0.28),
    0 2px 10px rgba(15, 30, 45, 0.45);
  transform: scale(1.12);
}
@media (max-width: 720px) {
  main {
    flex-direction: column;
  }
  aside {
    width: auto;
    max-height: 44%;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
  #map {
    width: 100%;
    height: 56%;
    flex: 1;
  }
}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="brand-dot"></span><strong>滴滴行程地图 Demo</strong></div>
  <div class="header-meta" id="headerMeta">示例数据</div>
</header>
<main>
  <aside>
    <section class="stats" aria-label="行程统计">
      <div class="stat"><b id="statTrips">0</b><span>行程</span></div>
      <div class="stat"><b id="statDistance">0</b><span>公里</span></div>
      <div class="stat"><b id="statAmount">0</b><span>金额</span></div>
    </section>
    <section class="filters" aria-label="筛选条件">
      <label>城市
        <select id="cityFilter"></select>
      </label>
      <label>地点
        <input id="searchInput" type="search" placeholder="搜索地点">
      </label>
      <label class="check">
        <input id="lineToggle" type="checkbox">
        <span>显示全部连线</span>
      </label>
      <div class="selection-bar">
        <span class="selection-label" id="selectionLabel"></span>
        <button class="clear-btn" id="clearSelectionBtn" type="button" hidden>清除选中</button>
      </div>
      <div class="legend">
        <div class="legend-item"><span class="legend-dot start"></span>起点</div>
        <div class="legend-item"><span class="legend-dot dest"></span>终点</div>
        <div class="legend-item"><span class="legend-line start"></span>出发段</div>
        <div class="legend-item"><span class="legend-line dest"></span>到达段</div>
      </div>
    </section>
    <section class="selected-section" id="selectedSection" hidden>
      <h2 class="summary-title">相关行程</h2>
      <div class="selected-trips" id="selectedTrips"></div>
    </section>
    <section>
      <h2 class="summary-title">高频地点</h2>
      <div class="summary-list" id="summaryList"></div>
    </section>
  </aside>
  <div id="map"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const trips = window.__TRIPS__ || [];
let map = null;
let clusterGroup = null;
let currentCounts = new Map();
const markerMap = new Map();
const lines = [];
let selectedKey = "";

const cityFilter = document.getElementById("cityFilter");
const searchInput = document.getElementById("searchInput");
const lineToggle = document.getElementById("lineToggle");
const selectionLabel = document.getElementById("selectionLabel");
const clearSelectionBtn = document.getElementById("clearSelectionBtn");
const selectedSection = document.getElementById("selectedSection");
const selectedTripsList = document.getElementById("selectedTrips");

function esc(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function parseNumber(value) {
  const n = parseFloat(value);
  return Number.isFinite(n) ? n : 0;
}

function locationKey(city, role, name) {
  return city + "|" + role + "|" + name;
}

function makeIcon(html) {
  return L.divIcon({
    className: "",
    html: html,
    iconSize: [34, 34],
    iconAnchor: [17, 17]
  });
}

function markerContent(item, startCount, destCount, selected) {
  const total = startCount + destCount;
  if (total <= 0) return "";
  const cls = startCount > 0 && destCount > 0 ? "both" : (destCount > 0 ? "dest" : "start");
  const sel = selected ? " selected" : "";
  return '<div class="marker-dot ' + cls + sel + '">' + total + "</div>";
}

function addLocation(city, role, place) {
  if (!place || !place.lat || !place.lng) return;
  const key = locationKey(city, role, place.name);
  let item = markerMap.get(key);
  if (!item) {
    item = {
      key: key,
      city: city,
      name: place.name,
      lat: place.lat,
      lng: place.lng,
      matchedName: place.matched_name || "",
      address: place.address || "",
      marker: null,
      tripIds: []
    };
    markerMap.set(key, item);
  }
}

function buildIndex() {
  trips.forEach(function (trip, index) {
    trip.id = index;
    trip.pickupYear = trip.pickup ? trip.pickup.slice(0, 4) : "";
    addLocation(trip.cityNorm, "起点", trip.o);
    addLocation(trip.cityNorm, "终点", trip.d);
    if (trip.o && trip.o.lat && trip.o.lng) {
      markerMap.get(locationKey(trip.cityNorm, "起点", trip.o.name)).tripIds.push(index);
    }
    if (trip.d && trip.d.lat && trip.d.lng) {
      markerMap.get(locationKey(trip.cityNorm, "终点", trip.d.name)).tripIds.push(index);
    }
  });

  markerMap.forEach(function (item) {
    const marker = L.marker([item.lat, item.lng], {
      icon: makeIcon(""),
      title: item.name,
      zIndexOffset: 100
    });
    marker.on("click", function () {
      selectLocation(item.key);
    });
    item.marker = marker;
  });

  trips.forEach(function (trip) {
    if (!trip.o || !trip.d) return;
    const start = [trip.o.lat, trip.o.lng];
    const end = [trip.d.lat, trip.d.lng];
    const mid = [
      start[0] + (end[0] - start[0]) * 0.68,
      start[1] + (end[1] - start[1]) * 0.68
    ];
    const startLine = L.polyline([start, mid], {
      color: "#1677ff",
      weight: 3,
      opacity: 0.45,
      lineJoin: "round"
    });
    const endLine = L.polyline([mid, end], {
      color: "#fa8c16",
      weight: 6,
      opacity: 0.72,
      lineJoin: "round"
    });
    lines.push({ trip: trip, line: startLine, endLine: endLine });
  });
}

function matchesFilters(trip) {
  if (cityFilter.value !== "all" && trip.cityNorm !== cityFilter.value) return false;
  const q = searchInput.value.trim().toLowerCase();
  if (q) {
    const haystack = [
      trip.origin,
      trip.dest,
      trip.o ? trip.o.matched_name : "",
      trip.d ? trip.d.matched_name : ""
    ].join(" ").toLowerCase();
    if (haystack.indexOf(q) === -1) return false;
  }
  return true;
}

function tripUsesLocation(trip, key) {
  if (!key || !trip) return false;
  if (trip.o && locationKey(trip.cityNorm, "起点", trip.o.name) === key) return true;
  if (trip.d && locationKey(trip.cityNorm, "终点", trip.d.name) === key) return true;
  return false;
}

function clearSelection() {
  selectedKey = "";
  selectionLabel.textContent = "";
  clearSelectionBtn.hidden = true;
  selectedSection.hidden = true;
  applyFilters();
}

function selectLocation(key) {
  if (!markerMap.has(key)) return;
  if (selectedKey === key) {
    clearSelection();
    return;
  }
  selectedKey = key;
  applyFilters();
  const item = markerMap.get(selectedKey);
  if (item) {
    selectionLabel.textContent = item.name;
    clearSelectionBtn.hidden = false;
  }
}

function applyFilters() {
  const visibleTrips = trips.filter(matchesFilters);
  const visibleSet = new Set(visibleTrips.map(function (t) { return t.id; }));
  const counts = new Map();

  visibleTrips.forEach(function (trip) {
    if (trip.o && trip.o.lat && trip.o.lng) {
      const k = locationKey(trip.cityNorm, "起点", trip.o.name);
      const c = counts.get(k) || { start: 0, dest: 0 };
      c.start += 1;
      counts.set(k, c);
    }
    if (trip.d && trip.d.lat && trip.d.lng) {
      const k = locationKey(trip.cityNorm, "终点", trip.d.name);
      const c = counts.get(k) || { start: 0, dest: 0 };
      c.dest += 1;
      counts.set(k, c);
    }
  });
  currentCounts = counts;

  if (selectedKey && !counts.has(selectedKey)) {
    selectedKey = "";
    selectionLabel.textContent = "";
    clearSelectionBtn.hidden = true;
    selectedSection.hidden = true;
  }

  const selectedTrips = selectedKey
    ? visibleTrips.filter(function (t) { return tripUsesLocation(t, selectedKey); })
    : [];
  const selectedTripSet = new Set(selectedTrips.map(function (t) { return t.id; }));
  const relatedKeys = new Set();
  if (selectedKey) {
    relatedKeys.add(selectedKey);
    selectedTrips.forEach(function (t) {
      if (t.o) relatedKeys.add(locationKey(t.cityNorm, "起点", t.o.name));
      if (t.d) relatedKeys.add(locationKey(t.cityNorm, "终点", t.d.name));
    });
  }

  const visibleMarkers = [];
  markerMap.forEach(function (item) {
    const c = counts.get(item.key) || { start: 0, dest: 0 };
    const isRelated = !selectedKey || relatedKeys.has(item.key);
    item.marker.setIcon(makeIcon(markerContent(item, c.start, c.dest, item.key === selectedKey)));
    item.marker.setZIndexOffset(item.key === selectedKey ? 300 : 100);
    item.marker.remove();
    clusterGroup.removeLayer(item.marker);
    if (c.start + c.dest > 0 && isRelated) {
      visibleMarkers.push(item.marker);
      if (selectedKey) {
        item.marker.addTo(map);
      } else {
        clusterGroup.addLayer(item.marker);
      }
    } else {
      item.marker.remove();
    }
  });

  lines.forEach(function (entry) {
    const showSelected = selectedKey && selectedTripSet.has(entry.trip.id);
    const showAll = !selectedKey && lineToggle.checked && visibleSet.has(entry.trip.id);
    if (showSelected) {
      entry.line.setStyle({ opacity: 1, weight: 5 });
      entry.endLine.setStyle({ opacity: 1, weight: 7 });
    } else {
      entry.line.setStyle({ opacity: 0.45, weight: 3 });
      entry.endLine.setStyle({ opacity: 0.72, weight: 6 });
    }
    if (showSelected || showAll) {
      entry.line.addTo(map);
      entry.endLine.addTo(map);
      if (showSelected) {
        entry.line.bringToFront();
        entry.endLine.bringToFront();
      }
    } else {
      entry.line.remove();
      entry.endLine.remove();
    }
  });

  updateStats(visibleTrips);
  updateSelectedTrips(selectedTrips);
  updateSummary(visibleTrips, counts);
  if (selectedKey) {
    fitSelected(selectedTrips);
  } else {
    fitMarkers(visibleMarkers);
  }
}

function fitMarkers(overlays) {
  if (!map) return;
  if (overlays.length) {
    const bounds = L.latLngBounds(overlays.map(function (m) { return m.getLatLng(); }));
    map.fitBounds(bounds.pad(0.25), { maxZoom: 13 });
  } else {
    map.setView([33, 110], 5);
  }
}

function fitSelected(selectedTrips) {
  if (!map) return;
  const overlays = [];
  selectedTrips.forEach(function (trip) {
    if (trip.o && trip.o.lat && trip.o.lng) {
      const key = locationKey(trip.cityNorm, "起点", trip.o.name);
      const item = markerMap.get(key);
      if (item && overlays.indexOf(item.marker) === -1) overlays.push(item.marker);
    }
    if (trip.d && trip.d.lat && trip.d.lng) {
      const key = locationKey(trip.cityNorm, "终点", trip.d.name);
      const item = markerMap.get(key);
      if (item && overlays.indexOf(item.marker) === -1) overlays.push(item.marker);
    }
  });
  if (overlays.length) {
    const bounds = L.latLngBounds(overlays.map(function (m) { return m.getLatLng(); }));
    map.fitBounds(bounds.pad(0.35), { maxZoom: 15 });
  } else {
    map.setView([33, 110], 5);
  }
}

function updateStats(visibleTrips) {
  let distance = 0;
  let amount = 0;
  visibleTrips.forEach(function (t) {
    distance += parseNumber(t.distance);
    amount += parseNumber(t.amount);
  });
  document.getElementById("statTrips").textContent = visibleTrips.length;
  document.getElementById("statDistance").textContent = Math.round(distance).toLocaleString();
  document.getElementById("statAmount").textContent = "¥" + Math.round(amount).toLocaleString();
}

function updateSelectedTrips(selectedTrips) {
  if (!selectedKey) {
    selectedSection.hidden = true;
    selectedTripsList.innerHTML = "";
    return;
  }
  selectedSection.hidden = false;
  selectedTripsList.innerHTML = selectedTrips.slice(0, 8).map(function (t) {
    const title = (t.pickup ? t.pickup.slice(0, 16) : "时间缺失") + " · " + t.origin + " → " + t.dest;
    const meta = (t.amount ? "¥" + t.amount : "金额缺失") + (t.car ? " · " + t.car : "");
    return '<div class="trip-row"><b title="' + esc(title) + '">' + esc(title) + "</b>" +
      '<div class="trip-meta">' + esc(meta) + "</div></div>";
  }).join("") || '<div class="trip-row"><b>无匹配行程</b></div>';
}

function updateSummary(visibleTrips, counts) {
  const entries = [];
  markerMap.forEach(function (item) {
    const c = counts.get(item.key);
    if (c && c.start + c.dest > 0) {
      entries.push({
        key: item.key,
        name: item.name,
        city: item.city,
        total: c.start + c.dest,
        start: c.start,
        dest: c.dest
      });
    }
  });
  entries.sort(function (a, b) { return b.total - a.total; });
  const list = document.getElementById("summaryList");
  list.innerHTML = entries.slice(0, 8).map(function (e) {
    const selected = e.key === selectedKey ? " selected" : "";
    return '<div class="summary-row' + selected + '" data-key="' + esc(e.key) + '"><span class="name" title="' + esc(e.name) + '">' +
      esc(e.name) + "</span><span class=\"roles\">起 " + e.start + " · 终 " + e.dest +
      '</span><span class="count">' + e.total + "</span></div>";
  }).join("") || '<div class="summary-row"><span class="name">无匹配地点</span></div>';
}

function populateFilters() {
  const cityCounts = {};
  trips.forEach(function (t) {
    cityCounts[t.cityNorm] = (cityCounts[t.cityNorm] || 0) + 1;
  });
  let html = '<option value="all">全部（' + trips.length + "）</option>";
  Object.keys(cityCounts).sort().forEach(function (city) {
    html += '<option value="' + esc(city) + '">' + esc(city) + "（" + cityCounts[city] + "）</option>";
  });
  cityFilter.innerHTML = html;
}

function bindEvents() {
  cityFilter.addEventListener("change", applyFilters);
  searchInput.addEventListener("input", applyFilters);
  lineToggle.addEventListener("change", applyFilters);
  clearSelectionBtn.addEventListener("click", clearSelection);
  document.getElementById("summaryList").addEventListener("click", function (event) {
    const row = event.target.closest(".summary-row");
    if (row && row.dataset.key) selectLocation(row.dataset.key);
  });
}

function initMap() {
  map = L.map("map", { maxZoom: 19, minZoom: 3 }).setView([33, 110], 5);
  clusterGroup = L.markerClusterGroup({
    maxClusterRadius: 60,
    showCoverageOnHover: false
  });
  map.addLayer(clusterGroup);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  buildIndex();
  populateFilters();
  bindEvents();
  applyFilters();
  document.getElementById("headerMeta").textContent = trips.length + " 条示例行程";
}

initMap();
</script>
</body>
</html>
